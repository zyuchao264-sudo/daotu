<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>道途数据编辑器</title>
<style>
body{padding:24px;font-family:system-ui;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#2ecc71;margin-right:6px;}
.item{border:1px solid #aaa;padding:8px;margin:4px 0;border-radius:4px;}
</style>
</head>
<body>
<h2><span class="dot"></span>道途工作台</h2>
<h3>职业列表(careers)</h3>
<div id="box"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let data = null;
const box = document.getElementById('box');

socket.on('connect',()=>console.log("✅已连接socket"));
socket.on('disconnect',()=>console.log("❌断开socket"));

// 和后端事件对齐：fullData
socket.on('fullData',(recv)=>{
  console.log("📥收到fullData",recv);
  data = recv;
  render();
})

function render(){
  box.innerHTML="";
  if(!data || !data.careers){
    box.innerText="等待数据...";
    return;
  }
  data.careers.forEach(c=>{
    const div = document.createElement('div');
    div.className="item";
    div.innerText = `【${c.name}】 id:${c.id} hp:${c.hp}`;
    box.appendChild(div);
  })
}
</script>
</body>
</html>
