<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道途桌游 | 卡牌&职业协作工作台</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #f3ede0;
            margin: 0;
            padding: 12px;
            color: #222;
            font-family: "Microsoft Yahei", sans-serif;
        }
        h1 {
            margin-top:4px;
            margin-bottom:12px;
            font-size:32px;
        }
        .status-tag{
            display:inline-flex;
            align-items:center;
            gap:6px;
            font-size:14px;
            color:#444;
        }
        .status-dot{
            width:12px;height:12px;
            border-radius:50%;
            background:#42b983;
        }
        .btn-group{
            margin-bottom:12px;
            display:flex;
            gap:8px;
            flex-wrap:wrap;
        }
        button{
            padding:8px 14px;
            border:none;
            border-radius:6px;
            font-size:15px;
            cursor:pointer;
            color:white;
        }
        .btn-green{background:#347c34;}
        .btn-brown{background:#8b5e2c;}
        .tab-bar{
            display:flex;
            gap:6px;
            margin-bottom:14px;
        }
        .tab{
            padding:7px 16px;
            background:#d8cebc;
            border-radius:6px 6px 0 0;
            cursor:pointer;
        }
        .tab.active{
            background:#c9b89c;
            font-weight:bold;
        }
        /* ==========新增：顶部悬浮跟随横幅========== */
        .top-hero-banner{
            height:130px;
            width:100%;
            border-radius:8px;
            background:#e8e2d3;
            background-size:cover;
            background-position:center;
            margin-bottom:12px;
            border:2px solid #c9b89c;
            transition: background-image 0.3s ease;
        }
        .view-panel{
            display:none;
        }
        .view-panel.active{
            display:block;
        }
        .prof-container{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(320px,1fr));
            gap:14px;
        }
        /* ==========职业卡片 顶部图片区域========== */
        .prof-card{
            background:#fff8e3;
            padding:12px;
            border-radius:8px;
            border:1px solid #d4c8ad;
            overflow:hidden;
        }
        .card-hero-img{
            width:calc(100% + 24px);
            height:110px;
            border-radius:6px 6px 0 0;
            background-size:cover;
            background-position:center;
            margin:-12px -12px 10px -12px;
        }
        .talent-block{
            background:#fff3d4;
            padding:8px;
            margin:8px 0;
            border-radius:4px;
        }
        textarea,input{
            width:100%;
            padding:6px;
            margin:4px 0;
            border:1px solid #bbb;
            border-radius:4px;
        }
        .modal{
            position:fixed;
            left:0;top:0;right:0;bottom:0;
            background:rgba(0,0,0,0.45);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .modal-content{
            background:#f8f2e2;
            padding:20px;
            border-radius:10px;
            width:min(95vw,620px);
            max-height:90vh;
            overflow:auto;
        }
        .hide{
            display:none !important;
        }
    </style>
</head>
<body>
    <h1>道途桌游 | 卡牌&职业协作工作台 <span class="status-tag"><span class="status-dot"></span>已连接云端，多人协同模式</span></h1>

    <div class="btn-group">
        <button class="btn-green" onclick="openEditProf()">➕新增职业</button>
        <button class="btn-brown" onclick="openNewCard()">📋新建卡牌</button>
        <button class="btn-brown" onclick="exportJson()">📤导出JSON备份</button>
        <button class="btn-brown" onclick="openImportModal()">📥导入JSON</button>
    </div>

    <div class="tab-bar">
        <div class="tab active" data-view="profView" onclick="switchView('profView')">职业列表</div>
        <div class="tab" data-view="cardView" onclick="switchView('cardView')">卡牌库</div>
        <div class="tab" data-view="statView" onclick="switchView('statView')">统计看板</div>
    </div>

    <!-- =====【新增】悬浮跟随大图横幅===== -->
    <div class="top-hero-banner" id="topBanner"></div>

    <div id="profView" class="view-panel active">
        <div class="prof-container" id="profContainer"></div>
    </div>

    <div id="cardView" class="view-panel">
        <div id="cardContainer"></div>
    </div>

    <div id="statView" class="view-panel">
        <h3>统计看板</h3>
        <div id="statBody"></div>
    </div>


    <!-- 编辑职业弹窗 -->
    <div id="editProfModal" class="modal hide">
        <div class="modal-content">
            <h3>编辑职业</h3>
            <input placeholder="职业名称" id="inpProfName">
            <input placeholder="血量" id="inpHp">
            <input placeholder="装备位" id="inpEquip">
            <textarea placeholder="专属建筑、基础描述" id="inpDesc"></textarea>
            <textarea placeholder="初始被动" id="inpPassive"></textarea>
            <textarea placeholder="2级天赋A" id="inpT2a"></textarea>
            <textarea placeholder="2级天赋B" id="inpT2b"></textarea>
            <input placeholder="3级统一消耗" id="inpT3cost">
            <textarea placeholder="3级天赋A" id="inpT3a"></textarea>
            <textarea placeholder="3级天赋B" id="inpT3b"></textarea>
            <div style="margin-top:10px;display:flex;gap:8px;">
                <button class="btn-green" onclick="saveProf()">保存</button>
                <button class="btn-brown" onclick="closeEditProf()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 新建卡牌弹窗 -->
    <div id="cardModal" class="modal hide">
        <div class="modal-content">
            <h3>新建/编辑卡牌</h3>
            <input placeholder="卡牌名称" id="inpCardName">
            <textarea placeholder="卡牌效果描述" id="inpCardDesc"></textarea>
            <div style="margin-top:10px;display:flex;gap:8px;">
                <button class="btn-green" onclick="saveCard()">保存卡牌</button>
                <button class="btn-brown" onclick="closeCardModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 导入弹窗 -->
    <div id="importModal" class="modal hide">
        <div class="modal-content">
            <h3>导入JSON</h3>
            <textarea id="importText" style="height:220px;" placeholder="粘贴完整JSON文本"></textarea>
            <div style="margin-top:10px;display:flex;gap:8px;">
                <button class="btn-green" onclick="doImport()">确认导入</button>
                <button class="btn-brown" onclick="closeImportModal()">取消</button>
            </div>
        </div>
    </div>

<script>
// ============【职业图片映射，这里替换成你自己图片URL】============
const heroImageMap = {
    "猎人": "https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/80113a11109e40189010022100841111~tplv-a9rns2rl98-image.image",
    "商人": "https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/21023a22209e40189010022100842222~tplv-a9rns2rl98-image.image",
    "赌徒": "https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/31023a33309e40189010022100843333~tplv-a9rns2rl98-image.image",
    "圣骑士": "https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9rns2rl98/41023a44409e40189010022100844444~tplv-a9rns2rl98-image.image",
};
const defaultBannerImg = ""; // 默认横幅为空，使用css背景色

// socket连接
const socket = io();
let appData = {
    professions:[],
    cards:[]
};
let editProfIndex = -1;
let editCardIndex = -1;

socket.on("syncData",(data)=>{
    appData = JSON.parse(JSON.stringify(data));
    renderAll();
})

// 切换tab视图
function switchView(viewId){
    document.querySelectorAll(".view-panel").forEach(p=>p.classList.remove("active"));
    document.getElementById(viewId).classList.add("active");
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelector(`.tab[data-view="${viewId}"]`).classList.add("active");
}

// 渲染全部
function renderAll(){
    renderProfList();
    renderCardList();
    renderStat();
}

// =========渲染职业列表【重点：卡片顶部图片 + data-profname属性】=========
function renderProfList(){
    const container = document.getElementById("profContainer");
    container.innerHTML = "";
    appData.professions.forEach((prof,idx)=>{
        const imgUrl = heroImageMap[prof.name] || "";
        const div = document.createElement("div");
        div.className = "prof-card";
        div.dataset.profname = prof.name; //悬浮读取职业名称

        div.innerHTML = `
            <div class="card-hero-img" style="background-image:url('${imgUrl}')"></div>
            <h3 style="margin:4px 0;">${prof.name}</h3>
            <div>血量: ${prof.hp || 8} | 装备位: ${prof.equip || "1武器1护具1鞋1道具1"}</div>
            <div style="margin:6px 0;white-space:pre-wrap;">${prof.desc||""}</div>

            <div class="talent-block">
                <b>初始被动</b>
                <div style="white-space:pre-wrap;">${prof.passive||"待填写"}</div>
            </div>

            <div class="talent-block">
                <b>2级天赋A</b>
                <div style="white-space:pre-wrap;">${prof.t2a||"待填写"}</div>
            </div>
            <div class="talent-block">
                <b>2级天赋B</b>
                <div style="white-space:pre-wrap;">${prof.t2b||"待填写"}</div>
            </div>

            <div class="talent-block">
                <b>3级统一消耗：${prof.t3cost||"4金"}</b>
            </div>

            <div class="talent-block">
                <b>3级天赋A</b>
                <div style="white-space:pre-wrap;">${prof.t3a||"待填写"}</div>
            </div>
            <div class="talent-block">
                <b>3级天赋B</b>
                <div style="white-space:pre-wrap;">${prof.t3b||"待填写"}</div>
            </div>

            <div style="margin-top:10px;display:flex;gap:6px;">
                <button class="btn-green" onclick="openEditProf(${idx})">编辑职业</button>
                <button class="btn-brown" onclick="deleteProf(${idx})">删除职业</button>
            </div>
        `;
        container.appendChild(div);
    })
}

// ==========悬浮监听逻辑：hover卡片切换顶部横幅==========
document.addEventListener('mouseover',function(e){
    const cardDom = e.target.closest('.prof-card');
    const bannerDom = document.getElementById('topBanner');
    if(cardDom){
        const name = cardDom.dataset.profname;
        if(heroImageMap[name]){
            bannerDom.style.backgroundImage = `url(${heroImageMap[name]})`;
        }
    }
})
document.addEventListener('mouseout',function(e){
    const cardDom = e.target.closest('.prof-card');
    if(cardDom && !e.relatedTarget?.closest('.prof-card')){
        document.getElementById('topBanner').style.backgroundImage = defaultBannerImg;
    }
})


// 职业弹窗
function openEditProf(idx=-1){
    editProfIndex = idx;
    const modal = document.getElementById("editProfModal");
    modal.classList.remove("hide");
    if(idx >=0){
        const p = appData.professions[idx];
        document.getElementById("inpProfName").value = p.name||"";
        document.getElementById("inpHp").value = p.hp||"";
        document.getElementById("inpEquip").value = p.equip||"";
        document.getElementById("inpDesc").value = p.desc||"";
        document.getElementById("inpPassive").value = p.passive||"";
        document.getElementById("inpT2a").value = p.t2a||"";
        document.getElementById("inpT2b").value = p.t2b||"";
        document.getElementById("inpT3cost").value = p.t3cost||"";
        document.getElementById("inpT3a").value = p.t3a||"";
        document.getElementById("inpT3b").value = p.t3b||"";
    }else{
        document.getElementById("inpProfName").value = "";
        document.getElementById("inpHp").value = "";
        document.getElementById("inpEquip").value = "";
        document.getElementById("inpDesc").value = "";
        document.getElementById("inpPassive").value = "";
        document.getElementById("inpT2a").value = "";
        document.getElementById("inpT2b").value = "";
        document.getElementById("inpT3cost").value = "";
        document.getElementById("inpT3a").value = "";
        document.getElementById("inpT3b").value = "";
    }
}
function closeEditProf(){
    document.getElementById("editProfModal").classList.add("hide");
}
function saveProf(){
    const obj = {
        name:document.getElementById("inpProfName").value.trim(),
        hp:document.getElementById("inpHp").value.trim(),
        equip:document.getElementById("inpEquip").value.trim(),
        desc:document.getElementById("inpDesc").value.trim(),
        passive:document.getElementById("inpPassive").value.trim(),
        t2a:document.getElementById("inpT2a").value.trim(),
        t2b:document.getElementById("inpT2b").value.trim(),
        t3cost:document.getElementById("inpT3cost").value.trim(),
        t3a:document.getElementById("inpT3a").value.trim(),
        t3b:document.getElementById("inpT3b").value.trim(),
    }
    if(!obj.name){alert("职业名称不能为空");return;}
    if(editProfIndex >=0){
        appData.professions[editProfIndex]=obj;
    }else{
        appData.professions.push(obj);
    }
    socket.emit("pushData",appData);
    closeEditProf();
}
function deleteProf(idx){
    if(!confirm("确定删除该职业？"))return;
    appData.professions.splice(idx,1);
    socket.emit("pushData",appData);
}

//卡牌
function renderCardList(){
    const c = document.getElementById("cardContainer");
    c.innerHTML="";
    appData.cards.forEach((card,idx)=>{
        c.innerHTML +=`
        <div class="prof-card">
            <h3>${card.name}</h3>
            <div style="white-space:pre-wrap;">${card.desc}</div>
            <div style="margin-top:8px;display:flex;gap:6px;">
                <button class="btn-green" onclick="openNewCard(${idx})">编辑</button>
                <button class="btn-brown" onclick="delCard(${idx})">删除</button>
            </div>
        </div>
        `
    })
}
function openNewCard(idx=-1){
    editCardIndex=idx;
    const m = document.getElementById("cardModal");
    m.classList.remove("hide");
    if(idx>=0){
        const cd = appData.cards[idx];
        document.getElementById("inpCardName").value=cd.name;
        document.getElementById("inpCardDesc").value=cd.desc;
    }else{
        document.getElementById("inpCardName").value="";
        document.getElementById("inpCardDesc").value="";
    }
}
function closeCardModal(){
    document.getElementById("cardModal").classList.add("hide");
}
function saveCard(){
    const o={
        name:document.getElementById("inpCardName").value.trim(),
        desc:document.getElementById("inpCardDesc").value.trim()
    }
    if(!o.name){alert("卡牌名称不能为空");return;}
    if(editCardIndex>=0){
        appData.cards[editCardIndex]=o;
    }else{
        appData.cards.push(o);
    }
    socket.emit("pushData",appData);
    closeCardModal();
}
function delCard(idx){
    if(!confirm("删除卡牌？"))return;
    appData.cards.splice(idx,1);
    socket.emit("pushData",appData);
}

//统计
function renderStat(){
    const s = document.getElementById("statBody");
    s.innerHTML = `
        <p>职业总数量：${appData.professions.length}</p>
        <p>卡牌总数量：${appData.cards.length}</p>
    `
}

//导出备份
function exportJson(){
    const text = JSON.stringify(appData,null,2);
    const blob = new Blob([text],{type:"application/json"});
    const a = document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="道途桌游备份.json";
    a.click();
}

//导入
function openImportModal(){
    document.getElementById("importModal").classList.remove("hide");
}
function closeImportModal(){
    document.getElementById("importModal").classList.add("hide");
}
function doImport(){
    const txt = document.getElementById("importText").value;
    try{
        const d = JSON.parse(txt);
        appData = d;
        socket.emit("pushData",appData);
        closeImportModal();
    }catch(e){
        alert("JSON格式错误！");
    }
}

</script>
</body>
</html>
