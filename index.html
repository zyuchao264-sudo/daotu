<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道途｜卡牌&职业协作工作台</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f3ede0;margin:0;padding:12px;color:#222;}
.container{max-width:1400px;margin:0 auto;}
.top-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
button{padding:6px 12px;border:none;border-radius:4px;background:#6b4c28;color:#fff;cursor:pointer;}
button.secondary{background:#888;}
button.success{background:#2b7036;}
.panel{background:#fff8e8;border:1px solid #c9b89c;padding:14px;border-radius:6px;margin-bottom:10px;}
.flex-row{display:flex;gap:12px;flex-wrap:wrap;}
.card-item{width:180px;background:#fff9e9;border:1px solid #b8a584;padding:8px;border-radius:4px;cursor:pointer;}
.tabs{display:flex;gap:6px;margin-bottom:10px;}
.tab{padding:6px 10px;background:#ddd;cursor:pointer;border-radius:4px;}
.tab.active{background:#6b4c28;color:white;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:99;}
.modal-content{background:#fff8e8;padding:16px;border-radius:6px;width:min(95%,720px);max-height:85vh;overflow:auto;}
.hidden{display:none !important;}
input,textarea,select{width:100%;padding:6px;margin:4px 0;border:1px solid #aaa;border-radius:3px;}
textarea{min-height:70px;}
.tree-node{margin:4px 0;padding:6px;border-left:3px solid #8c6b3e;background:#fff3dd;}
small{color:#555;}
.info-bar{font-size:13px;color:#444;}
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="container">
<div class="top-bar">
    <h2>道途桌游｜卡牌&职业协作工作台</h2>
    <span class="info-bar" id="syncStatus">🟡连接中…</span>
</div>
<div class="top-bar">
    <button id="btnAddCareer" class="success">➕新增职业</button>
    <button id="btnNewCard">🃏新建卡牌</button>
    <button id="btnExport">📤导出JSON备份</button>
    <button id="btnImport">📥导入JSON</button>
    <input type="file" id="importFile" accept=".json" class="hidden">
</div>
<div class="tabs">
    <div class="tab active" data-view="careerList">职业列表</div>
    <div class="tab" data-view="cardLib">卡牌库</div>
    <div class="tab" data-view="stat">统计看板</div>
</div>

<div id="view-careerList" class="view">
    <div id="careerWrap" class="flex-row"></div>
</div>

<div id="view-cardLib" class="view hidden">
    <div class="panel">
        <select id="filterCareer"><option value="">全部职业</option></select>
        <select id="filterType"><option value="">全部卡牌类型</option><option>行动卡</option><option>武器</option><option>护具</option><option>鞋</option><option>道具</option><option>宠物</option></select>
        <input placeholder="搜索卡牌名称" id="searchCard">
    </div>
    <div id="cardWrap" class="flex-row"></div>
</div>

<div id="view-stat" class="view hidden">
    <div class="panel">
        <h3>统计</h3>
        <div id="statText"></div>
    </div>
</div>

<!-- 编辑职业弹窗 -->
<div id="modalCareer" class="modal hidden">
<div class="modal-content">
    <h3 id="careerModalTitle">新增职业</h3>
    <input type="hidden" id="editCareerId">
    <label>职业名称</label><input id="cName">
    <label>血量</label><input type="number" id="cHp">
    <label>装备位描述</label><input id="cEquipSlot">
    <label>专属建筑名称</label><input id="cBuildingName">
    <label>建筑消耗&产出说明</label><textarea id="cBuildingDesc"></textarea>
    <label>初始被动天赋</label><textarea id="cPassive0"></textarea>

    <h4>2级天赋（二选一）消耗</h4>
    <label>天赋A名称</label><input id="cLv2aName">
    <label>天赋A效果</label><textarea id="cLv2aEffect"></textarea>
    <label>天赋A资源消耗</label><input id="cLv2aCost">

    <label>天赋B名称</label><input id="cLv2bName">
    <label>天赋B效果</label><textarea id="cLv2bEffect"></textarea>
    <label>天赋B资源消耗</label><input id="cLv2bCost">

    <h4>3级天赋（二选一）统一消耗</h4>
    <label>3级统一消耗</label><input id="cLv3Cost">
    <label>天赋A名称</label><input id="cLv3aName">
    <label>天赋A效果</label><textarea id="cLv3aEffect"></textarea>
    <label>天赋B名称</label><input id="cLv3bName">
    <label>天赋B效果</label><textarea id="cLv3bEffect"></textarea>

    <div class="top-bar">
        <button id="saveCareer" class="success">保存职业</button>
        <button id="delCareer">删除职业</button>
        <button id="closeCareerModal" class="secondary">关闭</button>
    </div>
</div>
</div>

<!-- 卡牌编辑弹窗 -->
<div id="modalCard" class="modal hidden">
<div class="modal-content">
    <h3 id="cardModalTitle">新建卡牌</h3>
    <input type="hidden" id="editCardId">
    <label>归属职业</label><select id="cardCareerSel"></select>
    <label>卡牌类型</label><select id="cardTypeSel">
        <option>行动卡</option>
        <option>武器</option>
        <option>护具</option>
        <option>鞋</option>
        <option>道具</option>
        <option>宠物</option>
    </select>
    <label>卡牌名称</label><input id="cardName">
    <label>数量(Xn)</label><input type="number" id="cardCount">
    <label>消耗</label><input id="cardCost">
    <label>卡牌效果</label><textarea id="cardEffect"></textarea>
    <label>备注</label><textarea id="cardNote"></textarea>
    <div class="top-bar">
        <button id="saveCard" class="success">保存卡牌</button>
        <button id="delCard">删除卡牌</button>
        <button id="closeCardModal" class="secondary">关闭</button>
    </div>
</div>
</div>

<script>
let socket = io();
let appData = null;

socket.on("connect",()=>{
    document.getElementById("syncStatus").innerText="🟢已连接云端，多人协同模式";
})
socket.on("disconnect",()=>{
    document.getElementById("syncStatus").innerText="🔴断开连接";
})
socket.on("fullData",(remoteData)=>{
    appData = remoteData;
    renderAll();
})

function pushCloud(){
    socket.emit("updateAll",appData);
}

// tab切换
document.querySelectorAll(".tab").forEach(t=>{
    t.onclick=()=>{
        document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
        t.classList.add("active");
        const v = t.dataset.view;
        document.querySelectorAll(".view").forEach(vv=>vv.classList.add("hidden"));
        document.getElementById("view-"+v).classList.remove("hidden");
        renderAll();
    }
})

// 新增职业按钮
document.getElementById("btnAddCareer").onclick=()=>openCareerModal(null);
document.getElementById("closeCareerModal").onclick=()=>document.getElementById("modalCareer").classList.add("hidden");
document.getElementById("closeCardModal").onclick=()=>document.getElementById("modalCard").classList.add("hidden");

function openCareerModal(careerObj){
    const m = document.getElementById("modalCareer");
    m.classList.remove("hidden");
    if(careerObj===null){
        document.getElementById("careerModalTitle").innerText="➕新增职业";
        document.getElementById("editCareerId").value="";
        document.getElementById("cName").value="";
        document.getElementById("cHp").value="8";
        document.getElementById("cEquipSlot").value="1武器1护具1鞋1道具";
        document.getElementById("cBuildingName").value="";
        document.getElementById("cBuildingDesc").value="";
        document.getElementById("cPassive0").value="";
        document.getElementById("cLv2aName").value="";document.getElementById("cLv2aEffect").value="";document.getElementById("cLv2aCost").value="2木3肉";
        document.getElementById("cLv2bName").value="";document.getElementById("cLv2bEffect").value="";document.getElementById("cLv2bCost").value="2木3肉";
        document.getElementById("cLv3Cost").value="4金";
        document.getElementById("cLv3aName").value="";document.getElementById("cLv3aEffect").value="";
        document.getElementById("cLv3bName").value="";document.getElementById("cLv3bEffect").value="";
    }else{
        document.getElementById("careerModalTitle").innerText="✏编辑职业："+careerObj.name;
        document.getElementById("editCareerId").value=careerObj.id;
        document.getElementById("cName").value=careerObj.name;
        document.getElementById("cHp").value=careerObj.hp;
        document.getElementById("cEquipSlot").value=careerObj.equipSlot;
        document.getElementById("cBuildingName").value=careerObj.buildingName;
        document.getElementById("cBuildingDesc").value=careerObj.buildingDesc;
        document.getElementById("cPassive0").value=careerObj.passive0;
        document.getElementById("cLv2aName").value=careerObj.lv2aName;document.getElementById("cLv2aEffect").value=careerObj.lv2aEffect;document.getElementById("cLv2aCost").value=careerObj.lv2aCost;
        document.getElementById("cLv2bName").value=careerObj.lv2bName;document.getElementById("cLv2bEffect").value=careerObj.lv2bEffect;document.getElementById("cLv2bCost").value=careerObj.lv2bCost;
        document.getElementById("cLv3Cost").value=careerObj.lv3Cost;
        document.getElementById("cLv3aName").value=careerObj.lv3aName;document.getElementById("cLv3aEffect").value=careerObj.lv3aEffect;
        document.getElementById("cLv3bName").value=careerObj.lv3bName;document.getElementById("cLv3bEffect").value=careerObj.lv3bEffect;
    }
}

document.getElementById("saveCareer").onclick=()=>{
    const editId = document.getElementById("editCareerId").value;
    const newId = editId||("career_"+Date.now());
    const career = {
        id:newId,
        name:document.getElementById("cName").value.trim(),
        hp:Number(document.getElementById("cHp").value),
        equipSlot:document.getElementById("cEquipSlot").value.trim(),
        buildingName:document.getElementById("cBuildingName").value.trim(),
        buildingDesc:document.getElementById("cBuildingDesc").value.trim(),
        passive0:document.getElementById("cPassive0").value.trim(),
        lv2aName:document.getElementById("cLv2aName").value.trim(),
        lv2aEffect:document.getElementById("cLv2aEffect").value.trim(),
        lv2aCost:document.getElementById("cLv2aCost").value.trim(),
        lv2bName:document.getElementById("cLv2bName").value.trim(),
        lv2bEffect:document.getElementById("cLv2bEffect").value.trim(),
        lv2bCost:document.getElementById("cLv2bCost").value.trim(),
        lv3Cost:document.getElementById("cLv3Cost").value.trim(),
        lv3aName:document.getElementById("cLv3aName").value.trim(),
        lv3aEffect:document.getElementById("cLv3aEffect").value.trim(),
        lv3bName:document.getElementById("cLv3bName").value.trim(),
        lv3bEffect:document.getElementById("cLv3bEffect").value.trim(),
    }
    if(!career.name){alert("职业名称不能为空");return;}
    if(editId){
        const idx = appData.careers.findIndex(x=>x.id===editId);
        appData.careers[idx]=career;
    }else{
        appData.careers.push(career);
    }
    pushCloud();
    document.getElementById("modalCareer").classList.add("hidden");
    renderAll();
}

document.getElementById("delCareer").onclick=()=>{
    const editId = document.getElementById("editCareerId").value;
    if(!editId) return;
    if(!confirm("确定删除该职业？该职业下卡牌不会自动删除，请手动处理卡牌归属。")) return;
    appData.careers = appData.careers.filter(c=>c.id!==editId);
    pushCloud();
    document.getElementById("modalCareer").classList.add("hidden");
    renderAll();
}

//卡牌
document.getElementById("btnNewCard").onclick=()=>openCardModal(null);
function openCardModal(cardObj){
    const m = document.getElementById("modalCard");
    m.classList.remove("hidden");
    const sel = document.getElementById("cardCareerSel");
    sel.innerHTML="";
    appData.careers.forEach(c=>{
        const opt = document.createElement("option");opt.value=c.id;opt.innerText=c.name;sel.appendChild(opt);
    })
    if(cardObj===null){
        document.getElementById("cardModalTitle").innerText="🃏新建卡牌";
        document.getElementById("editCardId").value="";
        document.getElementById("cardName").value="";
        document.getElementById("cardCount").value=3;
        document.getElementById("cardCost").value="";
        document.getElementById("cardEffect").value="";
        document.getElementById("cardNote").value="";
    }else{
        document.getElementById("cardModalTitle").innerText="✏编辑卡牌："+cardObj.name;
        document.getElementById("editCardId").value=cardObj.uid;
        document.getElementById("cardCareerSel").value=cardObj.career;
        document.getElementById("cardTypeSel").value=cardObj.type;
        document.getElementById("cardName").value=cardObj.name;
        document.getElementById("cardCount").value=cardObj.count;
        document.getElementById("cardCost").value=cardObj.cost;
        document.getElementById("cardEffect").value=cardObj.effect;
        document.getElementById("cardNote").value=cardObj.note;
    }
}

document.getElementById("saveCard").onclick=()=>{
    const editUid = document.getElementById("editCardId").value;
    const card = {
        uid:editUid||("card_"+Date.now()),
        career:document.getElementById("cardCareerSel").value,
        type:document.getElementById("cardTypeSel").value,
        name:document.getElementById("cardName").value.trim(),
        count:Number(document.getElementById("cardCount").value),
        cost:document.getElementById("cardCost").value.trim(),
        effect:document.getElementById("cardEffect").value.trim(),
        note:document.getElementById("cardNote").value.trim()
    }
    if(!card.name){alert("卡牌名称不能为空");return;}
    if(editUid){
        const idx = appData.cards.findIndex(x=>x.uid===editUid);
        appData.cards[idx]=card;
    }else{
        appData.cards.push(card);
    }
    pushCloud();
    document.getElementById("modalCard").classList.add("hidden");
    renderAll();
}
document.getElementById("delCard").onclick=()=>{
    const uid = document.getElementById("editCardId").value;
    if(!uid) return;
    if(!confirm("确定删除卡牌？")) return;
    appData.cards = appData.cards.filter(c=>c.uid!==uid);
    pushCloud();
    document.getElementById("modalCard").classList.add("hidden");
    renderAll();
}

//导出导入
document.getElementById("btnExport").onclick=()=>{
    const blob = new Blob([JSON.stringify(appData,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="道途项目备份.json";
    a.click();
}
document.getElementById("btnImport").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=async (e)=>{
    const f = e.target.files[0];
    const txt = await f.text();
    const imp = JSON.parse(txt);
    if(!confirm("导入会覆盖当前全部数据，确认？")) return;
    appData = imp;
    pushCloud();
    renderAll();
}

//渲染全部
function renderAll(){
    if(!appData) return;
    renderCareerList();
    renderCardFilterSel();
    renderCardList();
    renderStat();
}

function renderCareerList(){
    const wrap = document.getElementById("careerWrap");
    wrap.innerHTML="";
    appData.careers.forEach(c=>{
        const div = document.createElement("div");
        div.className="panel";
        div.style.width="340px";
        div.innerHTML=`
        <h4>${c.name}</h4>
        <p>血量：${c.hp}｜装备位：${c.equipSlot}</p>
        <p><small>专属建筑：${c.buildingName}</small><br><small>${c.buildingDesc}</small></p>
        <div class="tree-node"><b>初始被动</b><br>${c.passive0||"未填写"}</div>
        <div class="tree-node"><b>2级天赋A【${c.lv2aName||"未命名"}】消耗：${c.lv2aCost||"-"}</b><br>${c.lv2aEffect||"无效果"}</div>
        <div class="tree-node"><b>2级天赋B【${c.lv2bName||"未命名"}】消耗：${c.lv2bCost||"-"}</b><br>${c.lv2bEffect||"无效果"}</div>
        <div class="tree-node"><b>3级统一消耗：${c.lv3Cost||"-"}</b></div>
        <div class="tree-node"><b>3级天赋A【${c.lv3aName||"未命名"}】</b><br>${c.lv3aEffect||"无效果"}</div>
        <div class="tree-node"><b>3级天赋B【${c.lv3bName||"未命名"}】</b><br>${c.lv3bEffect||"无效果"}</div>
        <button class="secondary">编辑职业</button>
        `;
        div.querySelector("button").onclick=()=>openCareerModal(c);
        wrap.appendChild(div);
    })
}

function renderCardFilterSel(){
    const s = document.getElementById("filterCareer");
    s.innerHTML="<option value=''>全部职业</option>";
    appData.careers.forEach(c=>{
        const o = document.createElement("option");o.value=c.id;o.innerText=c.name;s.appendChild(o);
    })
    document.getElementById("cardCareerSel").innerHTML=s.innerHTML;
}

function renderCardList(){
    const wrap = document.getElementById("cardWrap");wrap.innerHTML="";
    const filterCareer = document.getElementById("filterCareer").value;
    const filterType = document.getElementById("filterType").value;
    const kw = document.getElementById("searchCard").value.toLowerCase();
    let list = appData.cards;
    if(filterCareer) list=list.filter(c=>c.career===filterCareer);
    if(filterType) list=list.filter(c=>c.type===filterType);
    if(kw) list=list.filter(c=>c.name.toLowerCase().includes(kw)||c.effect.toLowerCase().includes(kw));
    list.forEach(card=>{
        const ca = document.createElement("div");
        ca.className="card-item";
        const careerObj = appData.careers.find(x=>x.id===card.career);
        ca.innerHTML=`
        <b>${card.name}</b> <small>×${card.count}</small>
        <br><small>${careerObj?.name||"未知职业"}｜${card.type}</small>
        <p>消耗：${card.cost||"无"}</p>
        <p style="font-size:12px;">${card.effect.slice(0,120)}${card.effect.length>120?"…":""}</p>
        `;
        ca.onclick=()=>openCardModal(card);
        wrap.appendChild(ca);
    })
}

["filterCareer","filterType","searchCard"].forEach(id=>{
    document.getElementById(id).oninput=renderCardList;
})

function renderStat(){
    const t = document.getElementById("statText");
    t.innerHTML=`
职业总数：${appData.careers.length}<br>
卡牌总数：${appData.cards.length}<br>
`;
}
</script>
</body>
</html>
