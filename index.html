<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道途｜卡牌&职业协作工作台</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
:root{
    --bg:#f4efe6;
    --bg-accent:#ebe2d1;
    --panel:#fffaf1;
    --panel-strong:#fff4df;
    --border:#d8c6a7;
    --text:#26221b;
    --muted:#6a6155;
    --brand:#7b5430;
    --brand-strong:#5a3b20;
    --brand-soft:#f2e0c6;
    --success:#2f7a46;
    --danger:#a24a3b;
    --shadow:0 18px 45px rgba(52,38,19,.10);
}
body{
    margin:0;
    color:var(--text);
    background:
        radial-gradient(circle at top left, rgba(255,255,255,.7), transparent 34%),
        radial-gradient(circle at right top, rgba(215,178,118,.18), transparent 22%),
        linear-gradient(180deg, #f8f4ec 0%, var(--bg) 100%);
}
.container{max-width:1440px;margin:0 auto;padding:14px;}
.shell{
    background:rgba(255,255,255,.38);
    border:1px solid rgba(215,198,168,.75);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:14px;
    backdrop-filter:blur(8px);
}
.hero{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(280px,.85fr);
    gap:14px;
    align-items:stretch;
    margin-bottom:10px;
}
.hero-card{
    background:linear-gradient(135deg, rgba(255,250,242,.96), rgba(245,234,215,.95));
    border:1px solid rgba(215,198,168,.9);
    border-radius:20px;
    padding:14px;
    box-shadow:var(--shadow);
}
.hero-title{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:flex-start;
    flex-wrap:wrap;
}
.hero-title h2{margin:0;font-size:28px;letter-spacing:.5px;}
.hero-title p{margin:6px 0 0;color:var(--muted);}
.info-bar{font-size:13px;color:var(--muted);background:rgba(255,255,255,.75);padding:8px 12px;border-radius:999px;border:1px solid rgba(215,198,168,.85);}
.metric-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.metric{
    min-width:120px;
    padding:10px 12px;
    border-radius:14px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(215,198,168,.75);
}
.metric strong{display:block;font-size:20px;line-height:1.1;}
.metric span{font-size:12px;color:var(--muted);}
.top-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
button{
    padding:9px 14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(180deg, var(--brand), var(--brand-strong));
    color:#fff;
    cursor:pointer;
    box-shadow:0 10px 18px rgba(123,84,48,.16);
}
button.secondary{background:#8f8a82;}
button.success{background:linear-gradient(180deg, var(--success), #236136);}
button.ghost{
    background:transparent;
    color:var(--brand-strong);
    border:1px solid rgba(123,84,48,.25);
    box-shadow:none;
}
button:active{transform:translateY(1px);}
.panel{
    background:linear-gradient(180deg, rgba(255,251,244,.96), rgba(255,245,226,.94));
    border:1px solid var(--border);
    padding:14px;
    border-radius:18px;
    margin-bottom:12px;
    box-shadow:0 10px 24px rgba(78,55,24,.06);
}
.career-card{
    width:360px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden;
    position:relative;
}
.career-portrait{
    position:relative;
    width:100%;
    aspect-ratio: 3 / 4;
    border-radius:16px;
    overflow:hidden;
    background:linear-gradient(180deg, #f5e7c5, #e2c995);
    border:1px solid rgba(181,140,72,.55);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.career-portrait img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.career-portrait::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(72,46,15,.02) 55%, rgba(31,18,8,.16) 100%);
    pointer-events:none;
}
.career-rank{
    position:absolute;
    left:12px;
    top:12px;
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, #ead08f, #bf8d3e);
    border:1px solid #8e652d;
    color:#5e4016;
    font-weight:700;
    z-index:1;
    box-shadow:0 8px 16px rgba(101,72,24,.18);
}
.career-body{display:flex;flex-direction:column;gap:10px;}
.career-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.career-head h4{margin:0;font-size:22px;}
.career-subtitle{color:var(--brand-strong);font-size:13px;font-weight:700;letter-spacing:.2px;margin-top:4px;}
.career-rolechip{
    flex:0 0 auto;
    padding:6px 10px;
    border-radius:999px;
    background:#f0dfbd;
    color:#6a4b1d;
    border:1px solid #c9a968;
    font-size:12px;
    font-weight:700;
}
.career-summary{
    padding:10px 12px;
    border-radius:14px;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(215,198,168,.7);
    color:#56493a;
    line-height:1.65;
    font-size:13px;
}
.career-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}
.career-chip{
    padding:5px 9px;
    border-radius:999px;
    background:#fff6df;
    color:#7b5a2d;
    border:1px solid rgba(176,131,63,.35);
    font-size:12px;
}
.career-facts{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:8px;
}
.career-facts .fact{
    padding:8px 9px;
    border-radius:12px;
    background:#fff7ea;
    border:1px solid rgba(205,179,134,.7);
}
.career-facts .fact b{
    display:block;
    font-size:11px;
    color:#8a6a3c;
    margin-bottom:4px;
}
.career-facts .fact span{
    display:block;
    font-size:12px;
    line-height:1.45;
}
.career-details{
    border-top:1px solid rgba(181,140,72,.2);
    padding-top:2px;
}
.career-details summary{
    cursor:pointer;
    list-style:none;
    font-weight:700;
    color:var(--brand-strong);
    padding:6px 0;
}
.career-details summary::-webkit-details-marker{display:none;}
.career-details .tree-node{font-size:12px;line-height:1.55;margin:6px 0;padding:8px 10px;}
.career-action{
    width:100%;
    margin-top:2px;
}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.section-title h3,.section-title h4{margin:0;}
.section-title small{color:var(--muted);}
.dashboard{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:14px;
    margin-bottom:10px;
}
.dashboard-card{
    background:linear-gradient(180deg, rgba(255,252,247,.98), rgba(247,236,214,.96));
    border:1px solid rgba(215,198,168,.95);
    border-radius:22px;
    padding:14px;
    box-shadow:var(--shadow);
}
.dashboard-card h3{margin:0 0 8px;font-size:18px;}
.dashboard-card p{margin:0 0 8px;color:var(--muted);line-height:1.5;font-size:13px;}
.dashboard-card textarea,.dashboard-card input{margin-top:0;}
.map-wrap{
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;
    align-items:start;
}
.hex-scene{
    padding:12px;
    border-radius:18px;
    background:
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,248,236,.9)),
        repeating-linear-gradient(0deg, rgba(123,84,48,.05) 0 1px, transparent 1px 22px);
    border:1px dashed rgba(123,84,48,.24);
    min-height:190px;
}
.hex-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    max-width:360px;
    margin:0 auto;
}
.hex-grid .row-offset{margin-top:26px;}
.hex{
    aspect-ratio:1 / 1.1;
    clip-path:polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0 50%);
    background:linear-gradient(180deg, #d8c09a, #b89461);
    border:1px solid rgba(92,66,34,.28);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff9ef;
    font-weight:700;
    text-shadow:0 1px 0 rgba(0,0,0,.15);
    box-shadow:0 10px 24px rgba(96,69,32,.14);
}
.hex.alt{background:linear-gradient(180deg, #e5d4b5, #c79f6f);}
.hex.note{
    background:linear-gradient(180deg, #7f5a36, #5f4026);
}
.map-note{
    min-width:240px;
    max-width:300px;
}
.tabs{
    display:flex;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
    position:sticky;
    top:10px;
    z-index:20;
    padding:8px 10px;
    border-radius:16px;
    background:rgba(250,245,236,.82);
    backdrop-filter:blur(8px);
    border:1px solid rgba(215,198,168,.72);
}
.tab{
    padding:9px 14px;
    background:rgba(255,255,255,.7);
    cursor:pointer;
    border-radius:999px;
    border:1px solid rgba(215,198,168,.9);
    color:var(--muted);
}
.tab.active{
    background:linear-gradient(180deg, var(--brand), var(--brand-strong));
    color:white;
    border-color:transparent;
}
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(20,14,9,.44);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99;
    padding:18px;
}
.modal-content{
    background:linear-gradient(180deg, #fffaf1, #f8eed9);
    padding:18px;
    border-radius:20px;
    width:min(96%,760px);
    max-height:88vh;
    overflow:auto;
    border:1px solid rgba(215,198,168,.95);
    box-shadow:var(--shadow);
}
.hidden{display:none !important;}
input,textarea,select{
    width:100%;
    padding:10px 12px;
    margin:6px 0 10px;
    border:1px solid #cdb999;
    border-radius:12px;
    background:rgba(255,255,255,.9);
    color:var(--text);
}
textarea{min-height:96px;resize:vertical;}
.tree-node{
    margin:8px 0;
    padding:10px 12px;
    border-left:4px solid #8c6b3e;
    background:#fff4e0;
    border-radius:10px;
}
small{color:var(--muted);}
.flex-row{display:flex;gap:12px;flex-wrap:wrap;}
.card-item{
    width:220px;
    background:linear-gradient(180deg, #fff9ef, #f7ebd6);
    border:1px solid #c9b28b;
    padding:12px;
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(82,58,28,.06);
}
.card-item b{font-size:15px;}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.muted-card{
    background:rgba(255,255,255,.55);
    border:1px dashed rgba(123,84,48,.18);
    border-radius:16px;
    padding:12px;
}
@media (max-width: 1100px){
    .hero,.dashboard,.map-wrap,.grid-2{grid-template-columns:1fr;}
    .map-note{min-width:0;max-width:none;}
}
@media (max-width: 720px){
    .container{padding:10px;}
    .shell{padding:12px;border-radius:18px;}
    .hero-title h2{font-size:22px;}
    .hex-grid{max-width:none;}
    .tabs{top:6px;padding:8px;}
    .career-card{width:100%;}
    .career-facts{grid-template-columns:1fr;}
}
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="container">
<div class="shell">
<div class="hero">
    <div class="hero-card">
        <div class="hero-title">
            <div>
                <h2>道途桌游｜卡牌&职业协作工作台</h2>
                <p>把公告、地图示意和卡牌管理放在一个页面里，方便多人协同编辑。</p>
            </div>
            <span class="info-bar" id="syncStatus">🟡连接中…</span>
        </div>
        <div class="metric-row">
            <div class="metric"><strong id="metricCareer">0</strong><span>职业数量</span></div>
            <div class="metric"><strong id="metricCard">0</strong><span>卡牌数量</span></div>
            <div class="metric"><strong id="metricAnnouncement">0</strong><span>公告字数</span></div>
            <div class="metric"><strong id="metricMap">0</strong><span>地图备注字数</span></div>
        </div>
    </div>
    <div class="hero-card">
        <div class="section-title">
            <h3>快捷操作</h3>
            <small>常用入口</small>
        </div>
        <div class="top-bar">
            <button id="btnAddCareer" class="success">➕新增职业</button>
            <button id="btnNewCard">🃏新建卡牌</button>
            <button id="btnExport">📤导出JSON备份</button>
            <button id="btnImport">📥导入JSON</button>
            <input type="file" id="importFile" accept=".json" class="hidden">
        </div>
        <div class="muted-card">
            <small>提示：公告和地图备注都会跟随当前数据一起保存到云端。</small>
        </div>
    </div>
</div>

<div class="dashboard">
    <div class="dashboard-card">
        <div class="section-title">
            <div>
                <h3>公告栏</h3>
                <small>可编辑并保存的公共通知区</small>
            </div>
            <button id="saveAnnouncement" class="success">保存公告</button>
        </div>
        <p>这里可以写当前版本说明、测试提醒、协作须知，保存后会同步给所有打开页面的人。</p>
        <textarea id="announcementText" placeholder="请输入公告内容"></textarea>
    </div>
    <div class="dashboard-card">
        <div class="section-title">
            <div>
                <h3>地图模块</h3>
                <small>先放六边形地块示例，后续可继续扩展</small>
            </div>
            <button id="saveMapNote" class="ghost">保存备注</button>
        </div>
        <div class="map-wrap">
            <div class="hex-scene">
                <div class="hex-grid">
                    <div class="hex">A1</div>
                    <div class="hex alt">A2</div>
                    <div class="hex">A3</div>
                    <div class="hex alt row-offset">B1</div>
                    <div class="hex note row-offset">中心</div>
                    <div class="hex alt row-offset">B3</div>
                </div>
            </div>
            <div class="map-note">
                <label>地图备注 / 文字说明</label>
                <textarea id="mapNoteText" placeholder="例如：这里可以填写地图规则、地块说明、区域名字、坐标提示等"></textarea>
            </div>
        </div>
    </div>
</div>

<div class="tabs">
    <div class="tab active" data-view="careerList">职业列表</div>
    <div class="tab" data-view="cardLib">卡牌库</div>
    <div class="tab" data-view="stat">统计看板</div>
</div>

<div id="view-careerList" class="view">
    <div id="careerWrap" class="flex-row"></div>
</div>

<div id="view-cardLib" class="view hidden">
    <div class="panel">
        <div class="grid-2">
            <div>
                <label>职业筛选</label>
                <select id="filterCareer"><option value="">全部职业</option></select>
            </div>
            <div>
                <label>类型筛选</label>
                <select id="filterType"><option value="">全部卡牌类型</option><option>行动卡</option><option>武器</option><option>护具</option><option>鞋</option><option>道具</option><option>宠物</option></select>
            </div>
        </div>
        <label>搜索卡牌名称</label>
        <input placeholder="搜索卡牌名称" id="searchCard">
    </div>
    <div id="cardWrap" class="flex-row"></div>
</div>

<div id="view-stat" class="view hidden">
    <div class="panel">
        <h3>统计</h3>
        <div id="statText"></div>
    </div>
</div>

<!-- 编辑职业弹窗 -->
<div id="modalCareer" class="modal hidden">
<div class="modal-content">
    <h3 id="careerModalTitle">新增职业</h3>
    <input type="hidden" id="editCareerId">
    <label>职业名称</label><input id="cName">
    <label>血量</label><input type="number" id="cHp">
    <label>装备位描述</label><input id="cEquipSlot">
    <label>专属建筑名称</label><input id="cBuildingName">
    <label>建筑消耗&产出说明</label><textarea id="cBuildingDesc"></textarea>
    <label>初始被动天赋</label><textarea id="cPassive0"></textarea>

    <h4>2级天赋（二选一）消耗</h4>
    <label>天赋A名称</label><input id="cLv2aName">
    <label>天赋A效果</label><textarea id="cLv2aEffect"></textarea>
    <label>天赋A资源消耗</label><input id="cLv2aCost">

    <label>天赋B名称</label><input id="cLv2bName">
    <label>天赋B效果</label><textarea id="cLv2bEffect"></textarea>
    <label>天赋B资源消耗</label><input id="cLv2bCost">

    <h4>3级天赋（二选一）统一消耗</h4>
    <label>3级统一消耗</label><input id="cLv3Cost">
    <label>天赋A名称</label><input id="cLv3aName">
    <label>天赋A效果</label><textarea id="cLv3aEffect"></textarea>
    <label>天赋B名称</label><input id="cLv3bName">
    <label>天赋B效果</label><textarea id="cLv3bEffect"></textarea>

    <div class="top-bar">
        <button id="saveCareer" class="success">保存职业</button>
        <button id="delCareer">删除职业</button>
        <button id="closeCareerModal" class="secondary">关闭</button>
    </div>
</div>
</div>

<!-- 卡牌编辑弹窗 -->
<div id="modalCard" class="modal hidden">
<div class="modal-content">
    <h3 id="cardModalTitle">新建卡牌</h3>
    <input type="hidden" id="editCardId">
    <label>归属职业</label><select id="cardCareerSel"></select>
    <label>卡牌类型</label><select id="cardTypeSel">
        <option>行动卡</option>
        <option>武器</option>
        <option>护具</option>
        <option>鞋</option>
        <option>道具</option>
        <option>宠物</option>
    </select>
    <label>卡牌名称</label><input id="cardName">
    <label>数量(Xn)</label><input type="number" id="cardCount">
    <label>消耗</label><input id="cardCost">
    <label>卡牌效果</label><textarea id="cardEffect"></textarea>
    <label>备注</label><textarea id="cardNote"></textarea>
    <div class="top-bar">
        <button id="saveCard" class="success">保存卡牌</button>
        <button id="delCard">删除卡牌</button>
        <button id="closeCardModal" class="secondary">关闭</button>
    </div>
</div>
</div>

<script>
let socket = io();
let appData = null;

function normalizeAppData(data){
    const base = data || {};
    return {
        ...base,
        announcement: typeof base.announcement === "string" ? base.announcement : "欢迎来到道途协作工作台，公告栏可以在这里发布当日说明。",
        mapNote: typeof base.mapNote === "string" ? base.mapNote : "六边形地图示意区：这里先作为地图模块占位，后续可扩展成真正的地块编辑。",
        careers: Array.isArray(base.careers) ? base.careers.map(hydrateCareer) : [],
        cards: Array.isArray(base.cards) ? base.cards : [],
    };
}

const careerVisuals = {
    hunter:{
        image:"/新建文件夹/猎人.jpg",
        role:"荒野追猎者",
        subtitle:"林地、追踪、兽伴与陷阱",
        summary:"穿行于荒野与林地的游猎者，擅长追踪、远程压制与环境陷阱，和猎犬配合时会形成很强的压迫感。",
        keywords:["远程压制","追踪狩猎","兽伴协同"],
        rank:"2",
        profile:"猎人公会的王牌射手，靠精准与耐性在野外收割局势。",
        buildingDesc:"猎人公会擅长产出猎人标记，帮助你在战斗、追猎与伏击中持续建立优势。",
        passive0:"忠诚的伙伴：猎人开局自带特殊装备猎狗，部分卡牌可让猎人从兽伴身上获得额外收益。",
        lv2aName:"丛林之主",
        lv2aEffect:"困难地形的移动消耗减1，并且不会受到困难地形造成的伤害。",
        lv2aCost:"2木3肉",
        lv2bName:"鹰眼",
        lv2bEffect:"攻击距离加1，一回合只能进行一次基础攻击。",
        lv2bCost:"2木3肉"
    },
    merchant:{
        image:"/新建文件夹/商人.png",
        role:"资源操盘手",

function getCareerVisual(career){
    return careerVisuals[career.id] || careerVisuals[career.name] || {
        image:"",
        role:"职业设定",
        subtitle:"补充中",
        summary:"该职业的视觉与设定信息正在整理中。",
        keywords:["待补全"],
        rank:"1",
        profile:"",
    };
}

function hydrateCareer(career){
    const profile = getCareerVisual(career);
    const out = {...career};
    if(!out.buildingName || out.buildingName==="待填写") out.buildingName = career.buildingName || out.buildingName || "未命名建筑";
    if(!out.buildingDesc || out.buildingDesc==="待填写") out.buildingDesc = profile.buildingDesc || out.buildingDesc || "";
    if(!out.passive0 || out.passive0==="待填写") out.passive0 = profile.passive0 || out.passive0 || "";
    if(!out.lv2aName) out.lv2aName = profile.lv2aName || "";
    if(!out.lv2aEffect) out.lv2aEffect = profile.lv2aEffect || "";
    if(!out.lv2aCost) out.lv2aCost = profile.lv2aCost || "";
    if(!out.lv2bName) out.lv2bName = profile.lv2bName || "";
    if(!out.lv2bEffect) out.lv2bEffect = profile.lv2bEffect || "";
    if(!out.lv2bCost) out.lv2bCost = profile.lv2bCost || "";
    out._visual = profile;
    return out;
}

    const editId = document.getElementById("editCareerId").value;
    const newId = editId||("career_"+Date.now());
    const career = {
        id:newId,
        name:document.getElementById("cName").value.trim(),
        hp:Number(document.getElementById("cHp").value),
        equipSlot:document.getElementById("cEquipSlot").value.trim(),

        lv3bName:document.getElementById("cLv3bName").value.trim(),
        lv3bEffect:document.getElementById("cLv3bEffect").value.trim(),
    }
    if(!career.name){alert("职业名称不能为空");return;}
    const finalCareer = hydrateCareer(career);
    if(editId){
        const idx = appData.careers.findIndex(x=>x.id===editId);
        appData.careers[idx]=finalCareer;
    }else{
        appData.careers.push(finalCareer);
    }
    pushCloud();
    document.getElementById("modalCareer").classList.add("hidden");
    renderAll();
}

document.getElementById("importFile").onchange=async (e)=>{
    const f = e.target.files[0];
    const txt = await f.text();
    const imp = JSON.parse(txt);
    if(!confirm("导入会覆盖当前全部数据，确认？")) return;
    appData = normalizeAppData(imp);
    pushCloud();
    renderAll();
}

        const o = document.createElement("option");o.value=c.id;o.innerText=c.name;s.appendChild(o);
    })
    document.getElementById("cardCareerSel").innerHTML=s.innerHTML;
}

function renderCardList(){
    const wrap = document.getElementById("cardWrap");wrap.innerHTML="";
    const filterCareer = document.getElementById("filterCareer").value;
    const filterType = document.getElementById("filterType").value;
    const kw = document.getElementById("searchCard").value.toLowerCase();
    let list = appData.cards;
    if(filterCareer) list=list.filter(c=>c.career===filterCareer);
    if(filterType) list=list.filter(c=>c.type===filterType);
    if(kw) list=list.filter(c=>c.name.toLowerCase().includes(kw)||c.effect.toLowerCase().includes(kw));
    list.forEach(card=>{
        const ca = document.createElement("div");
        ca.className="card-item";
        const careerObj = appData.careers.find(x=>x.id===card.career);
        ca.innerHTML=`
        <b>${card.name}</b> <small>×${card.count}</small>
        <br><small>${careerObj?.name||"未知职业"}｜${card.type}</small>
        <p>消耗：${card.cost||"无"}</p>
        <p style="font-size:12px;">${card.effect.slice(0,120)}${card.effect.length>120?"…":""}</p>
        `;
        ca.onclick=()=>openCardModal(card);
        wrap.appendChild(ca);
    })
}

["filterCareer","filterType","searchCard"].forEach(id=>{
    document.getElementById(id).oninput=renderCardList;
})

function renderStat(){
    const t = document.getElementById("statText");
    t.innerHTML=`
职业总数：${appData.careers.length}<br>
卡牌总数：${appData.cards.length}<br>
公告字数：${(appData.announcement||"").length}<br>
地图备注字数：${(appData.mapNote||"").length}<br>
`;
}

function renderStatsOnly(){
    if(!appData) return;
    document.getElementById("metricCareer").innerText = appData.careers.length;
    document.getElementById("metricCard").innerText = appData.cards.length;
    document.getElementById("metricAnnouncement").innerText = (appData.announcement || "").length;
    document.getElementById("metricMap").innerText = (appData.mapNote || "").length;
    renderStat();
}

document.getElementById("announcementText").addEventListener("input",()=>{
    document.getElementById("metricAnnouncement").innerText = document.getElementById("announcementText").value.length;
});
document.getElementById("mapNoteText").addEventListener("input",()=>{
    document.getElementById("metricMap").innerText = document.getElementById("mapNoteText").value.length;
});
</script>
</body>
</html>
