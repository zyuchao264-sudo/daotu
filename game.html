<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>道途 · 联机桌游</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--wood:#241710;--wood2:#4a2c1b;--brass:#d5a85a;--teal:#174d4c;--teal2:#2b7770;--paper:#f8efd9;--muted:#bca98a;--danger:#d46c55}*{box-sizing:border-box}body{margin:0;color:var(--paper);font-family:"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 50% 20%,#315f5b 0,#163c3b 42%,#0c201f 100%);min-height:100vh}button,input,select{font:inherit}button{border:1px solid #c79445;background:linear-gradient(#7b572b,#4e301b);color:#fff5d9;border-radius:10px;padding:10px 15px;cursor:pointer;box-shadow:0 4px 12px #0005}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1500px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border:1px solid #a5783d;background:linear-gradient(90deg,#382119,#1c1512);border-radius:14px;box-shadow:0 8px 25px #0005}.brand{font-family:Georgia,serif;font-size:23px;color:#f5d18a}.status{font-size:13px;color:var(--muted)}.panel{background:linear-gradient(145deg,#2d2119dd,#171314ee);border:1px solid #88643a;border-radius:16px;padding:18px;box-shadow:inset 0 1px #ffffff18,0 12px 30px #0006}.auth{max-width:720px;margin:12vh auto}.auth h1{font-family:Georgia,serif;color:#f3ce86;font-size:32px;margin:0 0 8px}.auth p{color:var(--muted)}.form-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.field{flex:1;min-width:180px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;border-radius:9px;border:1px solid #82633d;background:#17191a;color:var(--paper);padding:11px}.career-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.career{padding:10px;border:1px solid #755736;border-radius:11px;background:#201817;text-align:left;color:var(--paper)}.career.selected{border-color:var(--brass);background:#4a3520;box-shadow:0 0 0 2px #d5a85a55}.career small{display:block;color:var(--muted);margin-top:4px}.hidden{display:none!important}.game{display:grid;grid-template-columns:230px minmax(480px,1fr) 310px;gap:14px;margin-top:14px}.side h2,.right h2{font-family:Georgia,serif;color:#f0ca80;font-size:18px;margin:0 0 12px}.player{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #ffffff12}.player.current{background:#8d633533;border-radius:8px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#75603c;color:#fff}.player-main{min-width:0;flex:1}.player-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-meta{font-size:11px;color:var(--muted)}.board-wrap{min-height:610px;display:flex;flex-direction:column}.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.board{position:relative;flex:1;min-height:520px;border-radius:14px;background:radial-gradient(circle at 50% 45%,#367d73,#1a514f 56%,#123a3b);overflow:hidden;border:1px solid #6aa59a66}.tile{position:absolute;width:94px;height:82px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);display:grid;place-items:center;text-align:center;color:#f9edcb;font-size:12px;font-weight:700;cursor:pointer;border:0;background:#697d55}.tile::after{content:"";position:absolute;inset:5px;clip-path:inherit;border:2px solid #ffffff44}.tile.plain{background:#99804e}.tile.forest{background:#447453}.tile.hill{background:#817064}.tile.river{background:#417e9b}.tile.spring,.tile.holySpring{background:#57a99d}.tile.trial{background:#8d6530}.tile.desert{background:#b28b56}.tile.void{background:#61527e}.tile.riverGod{background:#416f88}.tile.goldMine{background:#9d7730}.tile.occupied{box-shadow:0 0 0 3px #fff6;}.tile-label{z-index:1;pointer-events:none}.board-hint{font-size:12px;color:#d8c7a7;margin-top:8px}.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actionbar button{font-size:12px;padding:8px 11px}.resource-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.resource{background:#1c1816;border:1px solid #624a30;border-radius:8px;padding:6px 8px;font-size:12px}.resource b{color:#f5cc80}.hand{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{min-height:112px;padding:9px;border-radius:10px;border:1px solid #9b7949;background:linear-gradient(145deg,#e6d2a4,#b99762);color:#2b2018;box-shadow:0 4px 9px #0005;cursor:pointer}.card.secret{background:linear-gradient(145deg,#9e83c9,#55457a);color:#fff}.card strong{display:block;font-family:Georgia,serif;font-size:14px}.card small{display:block;color:#5b4631;margin-top:5px;font-size:11px}.log{max-height:180px;overflow:auto;font-size:12px;color:#d6c4a5}.log div{padding:5px 0;border-bottom:1px solid #ffffff12}.notice{margin-top:10px;color:#f3bc73;min-height:20px;font-size:13px}@media(max-width:1000px){.game{grid-template-columns:1fr}.side,.right{display:grid;grid-template-columns:1fr 1fr;gap:12px}.board{min-height:500px}}@media(max-width:600px){.shell{padding:8px}.side,.right{display:block}.tile{width:74px;height:66px;font-size:10px}}
</style></head>
<body><div class="shell">
<header class="topbar"><div class="brand">道途 · 联机桌游</div><div id="status" class="status">未连接</div></header>
<section id="auth" class="panel auth"><h1>进入一场道途</h1><p>创建房间时可以选择测试人数。选择 1 人即可进入单人测试模式，回合不会自动推进。</p><div class="form-row"><div class="field"><label>昵称</label><input id="nickname" maxlength="24" placeholder="例如：林间旅人"></div><div class="field"><label>房间码（加入时填写）</label><input id="roomCode" maxlength="6" placeholder="创建房间可留空"></div><div class="field"><label>创建房间人数</label><select id="maxPlayers"><option value="1">1 人 · 单人测试</option><option value="2">2 人</option><option value="3">3 人</option><option value="4">4 人</option><option value="5" selected>5 人</option></select></div></div><label style="color:var(--muted);font-size:12px">选择职业</label><div id="careers" class="career-grid" style="margin-top:7px"></div><div class="form-row"><button id="create">创建房间</button><button id="join">加入房间</button><button id="reconnect" class="hidden">使用上次对局重连</button></div><div id="authNotice" class="notice"></div></section>
<section id="lobby" class="panel hidden" style="max-width:820px;margin:32px auto"><h1 style="font-family:Georgia,serif;color:#f3ce86">等待其他玩家</h1><p>房间码：<strong id="lobbyCode"></strong>　目标人数：<strong id="lobbyTarget"></strong>　把房间码发给其他玩家。</p><div id="lobbyPlayers"></div><div class="form-row"><button id="start" class="hidden">开始对局</button><button id="leave">返回</button></div><div id="lobbyNotice" class="notice"></div></section>
<section id="game" class="game hidden"><aside class="panel side"><h2>远征队</h2><div id="players"></div><h2 style="margin-top:18px">行动记录</h2><div id="log" class="log"></div></aside><main class="panel board-wrap"><div class="board-head"><div><h2 style="font-family:Georgia,serif;color:#f0ca80;margin:0">六境地图</h2><div id="turn" class="status"></div></div><div id="roomBadge" class="status"></div></div><div id="board" class="board"></div><div class="board-hint">点击相邻地块移动。地形会消耗不同移动点数；每回合只能移动一次。</div><div id="actionbar" class="actionbar"></div><div id="gameNotice" class="notice"></div></main><aside class="panel right"><h2>我的状态</h2><div id="me"></div><h2 style="margin-top:18px">手牌</h2><div id="hand" class="hand"></div></aside></section>
</div><script>
const socket=io();let careers=[],readyCareerIds=new Set(),state=null,meId=localStorage.getItem('daotu.playerId')||'',roomCode=localStorage.getItem('daotu.roomCode')||'',token=localStorage.getItem('daotu.reconnectToken')||'',selectedCareer='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function notice(id,msg){$(id).textContent=msg||''}function setStatus(msg){$('status').textContent=msg}
socket.on('connect',()=>{setStatus('已连接服务器');if(token&&roomCode){$('reconnect').classList.remove('hidden')}});socket.on('disconnect',()=>setStatus('连接断开，可重连'));
socket.on('fullData',data=>{careers=data.careers||[];readyCareerIds=new Set((data.cards||[]).filter(card=>card.name&&card.effect).map(card=>card.career));renderCareers()});socket.on('gameState',payload=>{state=payload; if(payload.public.phase==='lobby') renderLobby(payload.public); else renderGame(payload)});
function renderCareers(){ $('careers').innerHTML=careers.map(c=>{const ready=readyCareerIds.has(c.id);return `<button class="career ${selectedCareer===c.id?'selected':''}" data-career="${esc(c.id)}" ${ready?'':'disabled'}>${esc(c.name)}<small>${ready?`生命 ${c.hp} · ${esc(c.buildingName||'专属建筑')}`:'卡牌待补充'}</small></button>`}).join('');document.querySelectorAll('[data-career]').forEach(b=>b.onclick=()=>{selectedCareer=b.dataset.career;renderCareers()}) }
function credentials(){return {nickname:$('nickname').value.trim(),careerId:selectedCareer,roomCode:$('roomCode').value.trim().toUpperCase(),maxPlayers:Number($('maxPlayers').value)}}
function handleReply(reply){if(!reply?.ok){notice('authNotice',reply?.error||'操作失败');return false}meId=reply.playerId;roomCode=reply.roomCode;token=reply.reconnectToken;localStorage.setItem('daotu.playerId',meId);localStorage.setItem('daotu.roomCode',roomCode);localStorage.setItem('daotu.reconnectToken',token);notice('authNotice','');return true}
$('create').onclick=()=>{const c=credentials();if(!c.nickname||!c.careerId)return notice('authNotice','请填写昵称并选择职业');socket.emit('createRoom',c,reply=>{if(handleReply(reply)){$('auth').classList.add('hidden');$('lobby').classList.remove('hidden')}})};
$('join').onclick=()=>{const c=credentials();if(!c.nickname||!c.careerId||!c.roomCode)return notice('authNotice','加入时需要昵称、房间码和职业');socket.emit('joinRoom',c,reply=>{if(handleReply(reply)){$('auth').classList.add('hidden');$('lobby').classList.remove('hidden')}})};
$('reconnect').onclick=()=>socket.emit('reconnectRoom',{roomCode,reconnectToken:token},reply=>{if(handleReply(reply)){$('auth').classList.add('hidden')}});
function renderLobby(publicState){const target=publicState.maxPlayers||5;$('lobbyCode').textContent=publicState.roomCode;$('lobbyTarget').textContent=`${target} 人`;$('lobbyPlayers').innerHTML=publicState.players.map(p=>`<div class="player"><div class="avatar">${esc((p.nickname||'?')[0])}</div><div class="player-main"><div class="player-name">${esc(p.nickname)} ${p.playerId===publicState.hostId?'· 房主':''}</div><div class="player-meta">${esc(careers.find(c=>c.id===p.careerId)?.name||'未选职业')} · ${p.connected?'在线':'掉线'}</div></div></div>`).join('');$('start').classList.toggle('hidden',publicState.hostId!==meId);$('start').disabled=publicState.players.length!==target;notice('lobbyNotice',publicState.players.length<target?`还需要 ${target-publicState.players.length} 名玩家。`:'人数已到齐，可以开始。')}
$('start').onclick=()=>socket.emit('startRoom',{roomCode,playerId:meId},reply=>{if(!reply.ok)notice('lobbyNotice',reply.error)});$('leave').onclick=()=>{localStorage.removeItem('daotu.playerId');localStorage.removeItem('daotu.roomCode');localStorage.removeItem('daotu.reconnectToken');location.reload()};
function tileName(t){return {plain:'平原',forest:'森林',hill:'丘陵',river:'河流',spring:'泉水',trial:'生存试炼',desert:'沙漠',void:'虚空',holySpring:'圣泉',riverGod:'河神',goldMine:'大金矿'}[t]||t}
function renderGame(payload){$('auth').classList.add('hidden');$('lobby').classList.add('hidden');$('game').classList.remove('hidden');const p=payload.public,me=p.players.find(x=>x.playerId===meId);$('roomBadge').textContent=`房间 ${p.roomCode}`;$('turn').textContent=p.phase==='playing'?`第 ${p.round} 轮 · ${p.players.find(x=>x.playerId===p.currentPlayerId)?.nickname||''} 的回合`:p.phase;$('players').innerHTML=p.players.map(x=>`<div class="player ${x.playerId===p.currentPlayerId?'current':''}"><div class="avatar">${esc((x.nickname||'?')[0])}</div><div class="player-main"><div class="player-name">${esc(x.nickname)}</div><div class="player-meta">${esc(careers.find(c=>c.id===x.careerId)?.name||'')} · ❤ ${x.hp}/${x.maxHp} · ★ ${x.score}</div></div>${x.playerId!==meId&&x.position===me?.position?`<button data-attack="${x.playerId}" style="padding:5px 7px;font-size:11px">攻击</button>`:''}</div>`).join('');document.querySelectorAll('[data-attack]').forEach(b=>b.onclick=()=>send({type:'attack',targetPlayerId:b.dataset.attack}));$('log').innerHTML=p.log.slice().reverse().map(x=>`<div>${esc(x.message)}</div>`).join('');$('board').innerHTML=p.tiles.map(t=>{const occupants=p.players.filter(x=>x.position===t.id);const [q,r]=t.id.split(':').map(Number);const left=50+(q*12)+(r*6),top=50+(r*14);return `<button class="tile ${t.type} ${occupants.length?'occupied':''}" style="left:calc(${left}% - 47px);top:calc(${top}% - 41px)" data-tile="${t.id}"><span class="tile-label">${tileName(t.type)}${t.building?`<br>🏠${esc(t.building.ownerName)}`:''}${occupants.length?'<br>👤'+occupants.length:''}</span></button>`}).join('');document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>send({type:'move',tileId:b.dataset.tile}));$('me').innerHTML=me?`<div><b>${esc(me.nickname)}</b><br><span class="status">${esc(careers.find(c=>c.id===me.careerId)?.name||'')}</span></div><div class="resource-row">${Object.entries(me.resources||{}).map(([k,v])=>`<span class="resource">${k}: <b>${v}</b></span>`).join('')}</div><div class="status">❤ ${me.hp}/${me.maxHp}　行动 ${me.actionsLeft}　${me.moved?'已移动':'可移动'}</div>`:'';$('hand').innerHTML=(payload.private.hand||[]).map(card=>`<div class="card" data-card="${esc(card.uid)}"><strong>${esc(card.name)}</strong><small>${esc(card.type)} · ${esc(card.cost)}</small></div>`).join('')||'<div class="status">暂无手牌</div>';document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>send({type:'playCard',cardUid:b.dataset.card}));$('actionbar').innerHTML=`<button data-action="draw">抽行动牌</button><button data-action="draw-extra">抽两张（额外消耗1肉）</button><button data-action="build">在当前位置建造</button><button data-action="harvest">收获当前位置</button><button data-action="end">结束回合</button><button data-action="end-game">手动结束游戏</button>`;document.querySelector('[data-action="draw"]').onclick=()=>send({type:'draw'});document.querySelector('[data-action="draw-extra"]').onclick=()=>send({type:'draw',extra:true});document.querySelector('[data-action="build"]').onclick=()=>send({type:'build',tileId:me?.position});document.querySelector('[data-action="harvest"]').onclick=()=>send({type:'harvest',tileId:me?.position});document.querySelector('[data-action="end"]').onclick=()=>send({type:'endTurn'});document.querySelector('[data-action="end-game"]').onclick=()=>send({type:'endGame'});}
function send(action){socket.emit('gameAction',{roomCode,playerId:meId,action},reply=>{if(!reply.ok)notice('gameNotice',reply.error);else notice('gameNotice',reply.roll?`本次移动点数：${reply.roll}`:'')})}
</script></body></html>
